name: daily-briefing

on:
  schedule:
    # GitHub Actions cron is UTC ONLY. `schedule:` accepts exactly one key —
    # `cron`. Any other key (e.g. `timezone`) makes the workflow file invalid,
    # and an invalid workflow registers NO schedule at all: it silently never
    # fires, with no failed run to notice.
    #
    # No fixed UTC cron can hold a constant Pacific time across DST, so this
    # picks an hour where BOTH mappings are early morning and NOTHING EVER
    # NEEDS CHANGING:
    #
    #   13:17 UTC == 06:17 PDT (summer, UTC-7)
    #             == 05:17 PST (winter, UTC-8)
    #
    # Minute :17 is deliberate. The scheduler queue spikes hardest at :00 and
    # secondarily at :15/:30/:45; an odd off-quarter minute dodges the herd.
    # Scheduled runs remain best-effort and can still be delayed under load —
    # if one is ever skipped entirely, use the "Run workflow" button below.
    - cron: "17 13 * * *"

  # Enables the manual "Run workflow" button (Actions -> daily-briefing -> right
  # side). The checkbox is a RECOVERY switch: cross-run dedupe records every
  # article that survives ingest, so if a run ships a broken or empty briefing,
  # those articles are suppressed on the retry and the day cannot be rebuilt.
  # Ticking this re-ingests everything inside the lookback window.
  # Scheduled runs always keep dedupe ON.
  workflow_dispatch:
    inputs:
      ignore_seen:
        description: "Recovery: re-ingest articles already marked published"
        type: boolean
        default: false

permissions:
  contents: write             # only for the keepalive commit (final step)

# A delayed run must never overlap the next day's run (both would write the same
# rows). Queue instead of running concurrently; never cancel a briefing midway.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 155 feeds, 48h lookback. On OpenAI at a 1s gap a
                              # normal run is ~5 min; the 60 exists for the bad
                              # night — a 429 retry storm, or a full failover to
                              # Gemini at its 13s free-tier spacing (~15 min).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        env:
          PYTHONUNBUFFERED: "1"
          # ---- persistence -------------------------------------------------
          # Supabase Postgres holds the briefing, the feed report, the cross-run
          # seen-set AND (since migration 004) the model configuration itself.
          # SUPABASE_SERVICE_KEY is the SERVICE ROLE key: it bypasses Row Level
          # Security, so it is a full-database credential and lives only here.
          # The dashboard reads with the publishable key plus a user JWT — never
          # put the service key in docs/.
          #
          # THESE THREE ARE NOW THE ONLY REQUIRED SETTINGS. Everything about
          # which model writes the briefing moved to the dashboard's Settings
          # tab; pipeline/settings.py reads that row before the first stage runs.
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Tables are isolated from the other apps in this shared project.
          SUPABASE_SCHEMA: news_aggregator

          # ---- provider keys: OPTIONAL BACKSTOP ----------------------------
          # The Settings tab is the normal source of these. They stay here as a
          # fallback for the one morning that matters: if Supabase is unreachable
          # when settings.py runs, it logs the failure and continues on the
          # environment — and with no key anywhere, there is no briefing at all.
          # llm.api_key() prefers the stored value and falls back to these, so a
          # secret that is set but stale is harmless. Safe to leave unset.
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          # OpenAI-compatible providers, same backstop rule. An unset secret is
          # an empty string, which api_key() treats as "not configured" — so
          # leaving every one of these blank is the normal case.
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

          # ---- model chain: DEFAULTS ONLY ----------------------------------
          # Used only when app_settings has no value for a field (a fresh
          # install, or SETTINGS_FROM_DB=0). The dashboard overrides all of it.
          #
          # THE GEMINI ENTRY IS NOT OPTIONAL. This job runs at 06:17 Pacific with
          # nobody awake. If the OpenAI key is missing, the credit runs out, or
          # the model ids turn out to be wrong, the chain walks past OpenAI
          # entirely and Gemini still writes the briefing. The failure is
          # reported loudly in the log and flagged on the dashboard.
          # DEPTH WITHIN A PROVIDER FIRST, then across providers. Quotas are
          # metered per model, so the likeliest failure — one model hitting its
          # own cap — is answered by the next model on the SAME key. Two Gemini
          # entries mean a Gemini-only setup still has somewhere to go.
          GATEKEEPER_MODEL: openai:gpt-5.6-sol
          EDITOR_MODEL:     openai:gpt-5.6-sol
          GATEKEEPER_FALLBACK_MODELS: openai:gpt-5.6-terra,openai:gpt-5.6-luna,gemini:gemini-3.5-flash,gemini:gemini-3.1-flash-lite
          EDITOR_FALLBACK_MODELS:     openai:gpt-5.6-terra,openai:gpt-5.6-luna,gemini:gemini-3.5-flash,gemini:gemini-3.1-flash-lite

          # Set to "0" to ignore app_settings entirely and run purely on the
          # values above — how to reproduce a run locally, or to bypass a bad
          # row without needing the dashboard first.
          SETTINGS_FROM_DB: "1"

          # Verify OpenAI ids against /v1/models once per run and correct a
          # near-miss (family name vs. dated snapshot id) instead of 404-ing
          # every call all night. Set to "0" to use the ids exactly as written.
          LLM_RESOLVE_MODELS: "1"

          # Reasoning-token headroom for the GPT-5.x family: reasoning bills as
          # output AND shares the output budget, so a long think can truncate
          # the JSON. Added on top of each stage's max_tokens. (The effort level
          # itself is set in the dashboard.)
          OPENAI_TOKEN_HEADROOM: "4000"

          # ---- rate control ----------------------------------------------
          # Per-provider minimum gap between calls, retries included.
          #   OpenAI paid tier: 1s is ample and keeps the run inside the timeout.
          #   Gemini free tier: the binding limit is gemini-3.5-flash at 5 RPM,
          #     so 13s (4.6 RPM) is the compliant value. It only applies if the
          #     chain actually reaches Gemini.
          OPENAI_MIN_INTERVAL: "1"
          GEMINI_MIN_INTERVAL: "13"

          # 429 = back off and fail over, do not abort. Unattended runs should
          # ride out a quota spike; set to "0" when debugging by hand if you
          # would rather see rate limits stop the run immediately.
          LLM_RETRY_429: "1"

          # ---- ingest scaling (155 feeds) --------------------------------
          INGEST_WORKERS: "16"
          REQUEST_TIMEOUT: "10"
          # 48h, not 24h. Most sources here are weekly/monthly blogs, so a 24h
          # window reported them all STALE every morning and missed posts that
          # landed between runs. Costs ~2x articles; TPM sits at 3% of the cap
          # so the headroom exists. NOTE: consecutive briefings will now overlap
          # — dedupe is per-run, not across runs.
          LOOKBACK_HOURS: "48"
          MAX_PER_FEED: "25"
          MAX_PER_SOURCE: "12"     # stops one noisy feed dominating the day
          MAX_TOTAL: "1500"        # global safety valve
          DATELESS_POLICY: "keep"  # "drop" = strict <24h, but loses dateless blogs
          ALLOWLIST_MODE: ""       # "1" enables the keyword allowlist (see README)

          # ---- cross-run dedupe ------------------------------------------
          # LOOKBACK_HOURS (48) is 2x the run interval (24h), so every article
          # sits in two consecutive windows and would publish twice. seen.py
          # keeps the ids already published in the seen_articles table and
          # ingest.py drops them. One indexed SELECT per run; rows outside the
          # retention window are deleted on the way out. Set to "0" to disable
          # and allow repeats.
          # "1" on every scheduled run; "0" only when the recovery checkbox on a
          # manual run is ticked. inputs.* is empty for schedule, so this is "1".
          CROSS_RUN_DEDUPE: ${{ inputs.ignore_seen && '0' || '1' }}
          SEEN_RETENTION_DAYS: "7"   # must exceed LOOKBACK_HOURS/24, with margin

          # ---- summarization ceiling -------------------------------------
          GATEKEEPER_BATCH_SIZE: "30"
          MAX_FEATURES: "200"      # overflow spills to also_notable, never dropped
          # 20, not 10. Each batch is one request against a 5 RPM ceiling, so
          # halving the request count matters far more than keeping payloads
          # small. TPM is at 3% of 250K, so the bigger payloads cost nothing.
          EDITOR_BATCH_SIZE: "20"
        run: python run.py

      - name: Publish feed health report to job summary
        if: ${{ always() }}
        working-directory: pipeline
        run: |
          if [ -f feed_report.md ]; then
            cat feed_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No feed_report.md produced (ingest did not complete)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload feed health report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feed-report
          path: |
            pipeline/feed_report.md
            pipeline/feed_report.json
          if-no-files-found: warn
          retention-days: 14

      # -------------------------------------------------------------------------
      # KEEPALIVE — GitHub auto-disables a scheduled workflow after 60 days with
      # no commit on the default branch. This pipeline writes only to Supabase,
      # so the repo never receives commits from normal operation and the cron
      # would
      # stop ~day 60. Commits a heartbeat once the branch has been quiet 50+ days.
      # Runs even if the pipeline failed, so a bad run can't let the schedule lapse.
      - name: Keepalive (avoid 60-day cron auto-disable)
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true      # a failed heartbeat must not fail the run
        run: |
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now=$(date +%s)
          age=$(( (now - last) / 86400 ))
          if [ "$last" -eq 0 ] || [ "$age" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
            git add .github/.keepalive
            git commit -m "chore: keepalive [skip ci]" || exit 0
            git push || echo "keepalive push failed (non-fatal)"
          else
            echo "Default branch last touched ${age}d ago; no keepalive needed."
          fi
