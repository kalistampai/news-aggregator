name: daily-briefing

on:
  schedule:
    # GitHub Actions cron is UTC ONLY. `schedule:` accepts exactly one key —
    # `cron`. Any other key (e.g. `timezone`) makes the workflow file invalid,
    # and an invalid workflow registers NO schedule at all: it silently never
    # fires, with no failed run to notice.
    #
    # No fixed UTC cron can hold a constant Pacific time across DST, so this
    # picks an hour where BOTH mappings are early morning and NOTHING EVER
    # NEEDS CHANGING:
    #
    #   13:17 UTC == 06:17 PDT (summer, UTC-7)
    #             == 05:17 PST (winter, UTC-8)
    #
    # Minute :17 is deliberate. The scheduler queue spikes hardest at :00 and
    # secondarily at :15/:30/:45; an odd off-quarter minute dodges the herd.
    # Scheduled runs remain best-effort and can still be delayed under load —
    # if one is ever skipped entirely, use the "Run workflow" button below.
    - cron: "17 13 * * *"
  workflow_dispatch:          # enables the manual "Run workflow" button

permissions:
  contents: write             # only for the keepalive commit (final step)

# A delayed run must never overlap the next day's run (both would PATCH the same
# Gist). Queue instead of running concurrently; never cancel a briefing midway.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 155 feeds, 48h lookback, 13s throttle ~= 12-15
                              # min typical. 60 covers a 429 retry storm, which
                              # can now exceed 45 because the inter-call gap is
                              # 2.6x wider than before.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_GIST_TOKEN:  ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID:        ${{ secrets.GIST_ID }}

          # ---- models (Flash / Flash-Lite only; never Pro on the free tier) ----
          GATEKEEPER_MODEL: gemini-3.1-flash-lite
          EDITOR_MODEL:     gemini-3.5-flash
          # A fallback must never point AT the bottleneck. gemini-3.5-flash is
          # capped at 5 RPM on the free tier and is already saturated, so the
          # gatekeeper now fails over to 2.5-flash-lite (10 RPM, ~idle) instead
          # of piling more load onto the model that is already 429-ing.
          EDITOR_FALLBACK_MODELS:     gemini-3.1-flash-lite
          GATEKEEPER_FALLBACK_MODELS: gemini-2.5-flash-lite

          # ---- rate control ----------------------------------------------
          # Global minimum gap between ANY two Gemini calls, retries included.
          # The binding limit is gemini-3.5-flash at 5 RPM — NOT the 15 RPM this
          # comment used to assume. Google tightened the free tier and the AI
          # Studio dashboard showed 5/5 RPM (red) on this model.
          #    5s = 12.0 RPM  -> 2.4x over the limit; this caused the 429 wall
          #   13s =  4.6 RPM  -> compliant
          LLM_MIN_INTERVAL: "13"

          # ---- ingest scaling (155 feeds) --------------------------------
          INGEST_WORKERS: "16"
          REQUEST_TIMEOUT: "10"
          # 48h, not 24h. Most sources here are weekly/monthly blogs, so a 24h
          # window reported them all STALE every morning and missed posts that
          # landed between runs. Costs ~2x articles; TPM sits at 3% of the cap
          # so the headroom exists. NOTE: consecutive briefings will now overlap
          # — dedupe is per-run, not across runs.
          LOOKBACK_HOURS: "48"
          MAX_PER_FEED: "25"
          MAX_PER_SOURCE: "12"     # stops one noisy feed dominating the day
          MAX_TOTAL: "1500"        # global safety valve
          DATELESS_POLICY: "keep"  # "drop" = strict <24h, but loses dateless blogs
          ALLOWLIST_MODE: ""       # "1" enables the keyword allowlist (see README)

          # ---- cross-run dedupe ------------------------------------------
          # LOOKBACK_HOURS (48) is 2x the run interval (24h), so every article
          # sits in two consecutive windows and would publish twice. seen.py
          # keeps the ids already published in the Gist and ingest.py drops
          # them. Costs +1 authenticated GET/run (~0.06% of the 5000/hr limit)
          # and ~33 KB in the Gist. Set to "0" to disable and allow repeats.
          CROSS_RUN_DEDUPE: "1"
          SEEN_RETENTION_DAYS: "7"   # must exceed LOOKBACK_HOURS/24, with margin

          # ---- summarization ceiling -------------------------------------
          GATEKEEPER_BATCH_SIZE: "30"
          MAX_FEATURES: "120"      # overflow spills to also_notable, never dropped
          # 20, not 10. Each batch is one request against a 5 RPM ceiling, so
          # halving the request count matters far more than keeping payloads
          # small. TPM is at 3% of 250K, so the bigger payloads cost nothing.
          EDITOR_BATCH_SIZE: "20"
        run: python run.py

      - name: Publish feed health report to job summary
        if: ${{ always() }}
        working-directory: pipeline
        run: |
          if [ -f feed_report.md ]; then
            cat feed_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No feed_report.md produced (ingest did not complete)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload feed health report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feed-report
          path: |
            pipeline/feed_report.md
            pipeline/feed_report.json
          if-no-files-found: warn
          retention-days: 14

      # -------------------------------------------------------------------------
      # KEEPALIVE — GitHub auto-disables a scheduled workflow after 60 days with
      # no commit on the default branch. This pipeline writes only to a Gist, so
      # the repo never receives commits from normal operation and the cron would
      # stop ~day 60. Commits a heartbeat once the branch has been quiet 50+ days.
      # Runs even if the pipeline failed, so a bad run can't let the schedule lapse.
      - name: Keepalive (avoid 60-day cron auto-disable)
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true      # a failed heartbeat must not fail the run
        run: |
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now=$(date +%s)
          age=$(( (now - last) / 86400 ))
          if [ "$last" -eq 0 ] || [ "$age" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
            git add .github/.keepalive
            git commit -m "chore: keepalive [skip ci]" || exit 0
            git push || echo "keepalive push failed (non-fatal)"
          else
            echo "Default branch last touched ${age}d ago; no keepalive needed."
          fi
